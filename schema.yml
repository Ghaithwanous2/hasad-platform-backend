openapi: 3.0.3
info:
  title: Hasad Platform API
  version: 1.0.0
  description: REST API for Hasad Platform
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifierTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IdentifierTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IdentifierTokenObtainPair'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierTokenObtainPair'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns the profile of the user associated with the access token.
      summary: Get the current authenticated user
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Creates a new farmer or trader account and sends an email verification
        code.
      summary: Register a farmer or trader
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/v1/auth/register/resend/:
    post:
      operationId: auth_register_resend_create
      description: Sends a new email verification code to the user's email address.
      summary: Resend email verification code
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEmailVerification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendEmailVerification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendEmailVerification'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendEmailVerificationResponse'
          description: ''
  /api/v1/auth/register/verify/:
    post:
      operationId: auth_register_verify_create
      description: Verifies the email code, activates the account, and returns JWT
        access and refresh tokens.
      summary: Verify email and sign in
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
          description: ''
  /api/v1/operations/handovers/{handover_id}/assign-inspector/:
    post:
      operationId: operations_handovers_assign_inspector_create
      description: ينفذ ADMIN الإسناد النهائي لمراقب INSPECTOR إلى انتقال حيازة محدد،
        وليس إلى مهمة التوصيل كاملة.
      summary: إسناد مراقب محايد لنقطة انتقال
      parameters:
      - in: path
        name: handover_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Handovers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignInspector'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignInspector'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignInspector'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectorAssignment'
          description: ''
        '400':
          description: بيانات الإسناد غير صالحة.
        '403':
          description: لا يملك المستخدم الصلاحية.
        '404':
          description: نقطة الانتقال غير موجودة.
  /api/v1/operations/handovers/create/:
    post:
      operationId: operations_handovers_create_create
      description: ينشئ انتقال حيازة واحداً. ينشئ كل طرف النقطة الموجودة في موقعه،
        ثم يتم إسناد المراقب المحايد بعملية منفصلة.
      summary: إنشاء نقطة انتقال حيازة
      tags:
      - Handovers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHandover'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateHandover'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateHandover'
        required: true
      security:
      - jwtAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Handover'
          description: ''
        '400':
          description: بيانات الانتقال غير صالحة.
        '403':
          description: لا يملك المستخدم الصلاحية.
        '404':
          description: مهمة التوصيل غير موجودة.
components:
  schemas:
    AccountTypeEnum:
      enum:
      - FARMER
      - TRADER
      type: string
      description: |-
        * `FARMER` - Farmer
        * `TRADER` - Trader
    AssignInspector:
      type: object
      properties:
        inspector_id:
          type: string
          format: uuid
          description: UUID of the active INSPECTOR account.
        exception_reason:
          type: string
          description: Required when the same inspector is already assigned to another
            handover in this delivery.
          maxLength: 1000
      required:
      - inspector_id
    AuthenticationTokens:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    CreateHandover:
      type: object
      properties:
        point_type:
          $ref: '#/components/schemas/PointTypeEnum'
        sequence:
          type: integer
          minimum: 1
        batch_reference:
          type: string
          maxLength: 80
        delivery_task_id:
          type: string
          format: uuid
          nullable: true
        from_party_type:
          $ref: '#/components/schemas/FromPartyTypeEnum'
        from_party_id:
          type: string
          format: uuid
        to_party_type:
          $ref: '#/components/schemas/ToPartyTypeEnum'
        to_party_id:
          type: string
          format: uuid
        location_address:
          type: string
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
      required:
      - batch_reference
      - from_party_id
      - from_party_type
      - location_address
      - point_type
      - sequence
      - to_party_id
      - to_party_type
    FromPartyTypeEnum:
      enum:
      - FARMER
      - TRADER
      - DRIVER
      - WAREHOUSE
      type: string
      description: |-
        * `FARMER` - المزارع
        * `TRADER` - التاجر
        * `DRIVER` - السائق
        * `WAREHOUSE` - المستودع
    Handover:
      type: object
      properties:
        handover_id:
          type: string
          format: uuid
          readOnly: true
        delivery_task:
          type: string
          format: uuid
          nullable: true
        batch_reference:
          type: string
          maxLength: 80
        point_type:
          $ref: '#/components/schemas/PointTypeEnum'
        sequence:
          type: integer
          maximum: 32767
          minimum: 0
        from_party_type:
          $ref: '#/components/schemas/FromPartyTypeEnum'
        from_party_id:
          type: string
          format: uuid
          nullable: true
        to_party_type:
          $ref: '#/components/schemas/ToPartyTypeEnum'
        to_party_id:
          type: string
          format: uuid
          nullable: true
        location_address:
          type: string
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/HandoverStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - batch_reference
      - created_at
      - from_party_type
      - handover_id
      - location_address
      - point_type
      - sequence
      - status
      - to_party_type
      - updated_at
    HandoverStatusEnum:
      enum:
      - AWAITING_INSPECTOR
      - INSPECTOR_ASSIGNED
      - INSPECTOR_ACCEPTED
      - IN_PROGRESS
      - REPORT_SUBMITTED
      - COMPLETED
      - CANCELLED
      type: string
      description: |-
        * `AWAITING_INSPECTOR` - بانتظار إسناد المراقب
        * `INSPECTOR_ASSIGNED` - تم إسناد المراقب
        * `INSPECTOR_ACCEPTED` - قبل المراقب المهمة
        * `IN_PROGRESS` - قيد التوثيق
        * `REPORT_SUBMITTED` - تم إرسال التقرير
        * `COMPLETED` - مكتملة
        * `CANCELLED` - ملغاة
    IdentifierTokenObtainPair:
      type: object
      properties:
        identifier:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - identifier
      - password
    InspectorAssignment:
      type: object
      properties:
        assignment_id:
          type: string
          format: uuid
          readOnly: true
        handover_id:
          type: string
          format: uuid
          readOnly: true
        inspector_id:
          type: string
          format: uuid
          readOnly: true
        assigned_by_id:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/InspectorAssignmentStatusEnum'
          readOnly: true
        is_current:
          type: boolean
          readOnly: true
        exception_reason:
          type: string
          readOnly: true
        assigned_at:
          type: string
          format: date-time
          readOnly: true
        accepted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        report_submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - accepted_at
      - assigned_at
      - assigned_by_id
      - assignment_id
      - exception_reason
      - handover_id
      - inspector_id
      - is_current
      - report_submitted_at
      - status
    InspectorAssignmentStatusEnum:
      enum:
      - ASSIGNED
      - ACCEPTED
      - REJECTED
      - IN_PROGRESS
      - REPORT_SUBMITTED
      - EXPIRED
      - REASSIGNMENT_REQUIRED
      - CANCELLED
      type: string
      description: |-
        * `ASSIGNED` - مسندة
        * `ACCEPTED` - مقبولة
        * `REJECTED` - مرفوضة بسبب تعارض أو تعذر
        * `IN_PROGRESS` - قيد التنفيذ
        * `REPORT_SUBMITTED` - تم إرسال التقرير
        * `EXPIRED` - منتهية
        * `REASSIGNMENT_REQUIRED` - تحتاج إعادة إسناد
        * `CANCELLED` - ملغاة
    PointTypeEnum:
      enum:
      - FARMER_TO_DRIVER
      - FARMER_TO_TRADER
      - DRIVER_TO_WAREHOUSE
      - WAREHOUSE_TO_DRIVER
      - WAREHOUSE_TO_TRADER
      - DRIVER_TO_TRADER
      type: string
      description: |-
        * `FARMER_TO_DRIVER` - من المزارع إلى السائق
        * `FARMER_TO_TRADER` - من المزارع إلى التاجر
        * `DRIVER_TO_WAREHOUSE` - من السائق إلى المستودع
        * `WAREHOUSE_TO_DRIVER` - من المستودع إلى السائق
        * `WAREHOUSE_TO_TRADER` - من المستودع إلى التاجر
        * `DRIVER_TO_TRADER` - من السائق إلى التاجر
    Register:
      type: object
      properties:
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
          maxLength: 30
        password:
          type: string
          writeOnly: true
          minLength: 8
        password_confirm:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
      required:
      - account_type
      - email
      - password
      - password_confirm
    RegisterResponse:
      type: object
      properties:
        message:
          type: string
        verification_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
      required:
      - account_id
      - message
      - verification_id
    ResendEmailVerification:
      type: object
      properties:
        verification_id:
          type: string
          format: uuid
      required:
      - verification_id
    ResendEmailVerificationResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    RoleEnum:
      enum:
      - ADMIN
      - OPERATIONS_STAFF
      - AUDITOR
      - QUALITY_MANAGER
      - DELIVERY_MANAGER
      - WAREHOUSE_MANAGER
      - WAREHOUSE_STAFF
      - FARMER
      - TRADER
      - DRIVER
      - INSPECTOR
      type: string
      description: |-
        * `ADMIN` - Administrator
        * `OPERATIONS_STAFF` - Operations Staff
        * `AUDITOR` - Auditor
        * `QUALITY_MANAGER` - Quality Manager
        * `DELIVERY_MANAGER` - Delivery Manager
        * `WAREHOUSE_MANAGER` - Warehouse Manager
        * `WAREHOUSE_STAFF` - Warehouse Staff
        * `FARMER` - Farmer
        * `TRADER` - Trader
        * `DRIVER` - Driver
        * `INSPECTOR` - Neutral Inspector
    ToPartyTypeEnum:
      enum:
      - FARMER
      - TRADER
      - DRIVER
      - WAREHOUSE
      type: string
      description: |-
        * `FARMER` - المزارع
        * `TRADER` - التاجر
        * `DRIVER` - السائق
        * `WAREHOUSE` - المستودع
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    UserMe:
      type: object
      properties:
        account_id:
          type: string
          format: uuid
          readOnly: true
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          nullable: true
          maxLength: 30
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        full_name:
          type: string
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - account_id
      - full_name
    VerifyEmail:
      type: object
      properties:
        verification_id:
          type: string
          format: uuid
        code:
          type: string
          writeOnly: true
          maxLength: 6
          minLength: 6
      required:
      - code
      - verification_id
    VerifyEmailResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/UserMe'
        tokens:
          $ref: '#/components/schemas/AuthenticationTokens'
      required:
      - message
      - tokens
      - user
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
